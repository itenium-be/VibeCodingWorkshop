<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie kent oma het best?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
	--bg: #fff4e6;
	--bg2: #ffe3c7;
	--ink: #4a2a1a;
	--muted: #8a6550;
	--card: #fffaf3;
	--accent: #e8553d;
	--accent-dark: #c43d27;
	--a: #e8553d;
	--b: #e8960c;
	--c: #2a9d8f;
	--d: #8e4fa8;
	--radius: 28px;
	--shadow: 0 .5rem 1.5rem rgba(120, 60, 20, .15);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
	font-family: Fredoka, "Trebuchet MS", system-ui, sans-serif;
	font-size: clamp(18px, 1.4vw, 28px);
	color: var(--ink);
	background:
		radial-gradient(circle at 15% 0%, #ffe9cf, transparent 55%),
		radial-gradient(circle at 100% 100%, #ffd9d0, transparent 50%),
		var(--bg);
	background-attachment: fixed;
}
button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; }
input, textarea { font: inherit; color: inherit; }
h1, h2 { line-height: 1.15; }

/* header */
.kop { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1.2rem 2rem; }
.kop h1 { margin: 0; font-size: clamp(1.8rem, 3vw, 3rem); color: var(--accent-dark); }
.tabs { display: flex; gap: .4rem; background: #fff; padding: .4rem; border-radius: 999px; box-shadow: var(--shadow); }
.tab { padding: .6em 1.4em; background: transparent; color: var(--ink); font-weight: 600; }
.tab[aria-current="page"] { background: var(--accent); color: #fff; }

.btn { padding: .7em 1.5em; background: #fff; color: var(--ink); font-weight: 600; box-shadow: var(--shadow); transition: transform .15s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.groot { font-size: 1.35em; padding: .65em 2em; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

main { padding: 1rem 2rem 3rem; max-width: 1400px; margin: 0 auto; }

/* Quiz maken */
.maken-kop { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.maken-kop h2 { margin: 0; font-size: 1.8em; }
.tel { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; padding: 0 .4em; border-radius: 999px; background: var(--b); color: #fff; font-size: .7em; vertical-align: middle; }
.lijst { list-style: none; padding: 0; margin: 1.5rem 0 0; display: grid; gap: 1rem; }
.rij { display: grid; grid-template-columns: auto auto 1fr auto; gap: 1.2rem; align-items: center; background: var(--card); padding: 1rem 1.4rem; border-radius: var(--radius); box-shadow: var(--shadow); }
.nr { width: 2.2em; height: 2.2em; border-radius: 50%; background: var(--b); color: #fff; display: grid; place-items: center; font-weight: 700; }
.duim { width: 6rem; height: 4.5rem; border-radius: 16px; object-fit: cover; background: var(--bg2); display: grid; place-items: center; font-size: 2rem; }
.rij-tekst { display: flex; flex-direction: column; gap: .2em; min-width: 0; }
.juist-antw { color: var(--c); font-weight: 500; }
.rij-knoppen { display: flex; gap: .4rem; }
.icoon { width: 2.6rem; height: 2.6rem; background: var(--bg2); color: var(--ink); display: grid; place-items: center; font-size: 1.1rem; padding: 0; }
.icoon:hover:not(:disabled) { background: #ffd0b0; }
.icoon:disabled { opacity: .3; cursor: default; }
.leeg-tekst { margin-top: 2rem; text-align: center; color: var(--muted); font-size: 1.3em; }

.overlay { position: fixed; inset: 0; z-index: 10; background: rgba(74, 42, 26, .45); display: grid; place-items: start center; overflow: auto; padding: 2rem 1rem; }
.editor { background: var(--card); border-radius: var(--radius); padding: 2rem; width: min(780px, 100%); display: grid; gap: 1.2rem; box-shadow: var(--shadow); }
.editor h2 { margin: 0; }
.veld { display: grid; gap: .4rem; font-weight: 600; }
.editor textarea, .editor input[type="text"] { width: 100%; padding: .6em .9em; border: 3px solid var(--bg2); border-radius: 18px; background: #fff; resize: vertical; }
.editor textarea:focus, .editor input[type="text"]:focus { outline: none; border-color: var(--b); }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: .6rem; }
legend { font-weight: 600; margin-bottom: .6rem; }
.antw-rij { display: grid; grid-template-columns: auto 1fr auto; gap: .7rem; align-items: center; padding: .4rem; border-radius: 22px; border: 3px solid transparent; }
.antw-rij.juist { border-color: var(--c); background: #e3f5f2; }
.letter { width: 2.2em; height: 2.2em; border-radius: 14px; background: var(--kleur); color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
.juist-keuze { display: flex; gap: .35em; align-items: center; font-weight: 500; cursor: pointer; padding-right: .5em; }
.juist-keuze input { width: 1.3em; height: 1.3em; accent-color: var(--c); }
.foto-veld { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.foto-veld img { max-height: 160px; max-width: 100%; border-radius: 18px; border: 5px solid #fff; box-shadow: var(--shadow); }
.foto-veld input[type="file"] { display: none; }
.knoppen { display: flex; justify-content: flex-end; gap: .8rem; flex-wrap: wrap; }

/* Spelen: opstelling */
.opstelling { display: flex; flex-direction: column; align-items: center; gap: 1.2rem; text-align: center; }
.titel-groot { font-size: clamp(2.2rem, 4vw, 4.4rem); margin: .5rem 0 0; }
.sub { margin: 0; color: var(--muted); font-size: 1.2em; }
.spelers { list-style: none; padding: 0; margin: .5rem 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 1rem; width: min(1000px, 100%); }
.spelers li { display: flex; align-items: center; gap: .7rem; background: #fff; border-radius: 999px; padding: .5rem .7rem .5rem .6rem; border: 4px solid var(--kleur); box-shadow: var(--shadow); }
.bol { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--kleur); flex: none; }
.spelers input { border: 0; background: transparent; font-size: 1.3em; font-weight: 600; min-width: 0; flex: 1; padding: .2em .3em; border-radius: 12px; }
.spelers input:focus { outline: 3px solid var(--bg2); }

/* Spelen: vraag */
.spel { min-height: 100vh; max-width: none; display: flex; flex-direction: column; gap: clamp(.6rem, 1.6vh, 1.4rem); padding: clamp(1rem, 2vh, 2rem) clamp(1rem, 3vw, 3rem); }
.spel-top { display: flex; justify-content: space-between; align-items: center; }
.voortgang { background: #fff; border-radius: 999px; padding: .3em 1em; font-weight: 600; color: var(--muted); box-shadow: var(--shadow); }
.stop { background: transparent; color: var(--muted); padding: .4em .9em; font-size: .9em; }
.stop:hover { background: #fff; }
.vraag { margin: 0; text-align: center; font-size: clamp(2rem, 4.4vw, 5.2rem); text-wrap: balance; }
.midden { flex: 1; display: grid; gap: clamp(.6rem, 1.5vw, 1.6rem); }
.met-foto .midden { grid-template-columns: minmax(0, 2fr) 3fr; align-items: center; }
.foto { justify-self: center; width: 100%; max-height: 40vh; border-radius: var(--radius); border: 8px solid #fff; box-shadow: var(--shadow); object-fit: contain; background: #fff; }
.tegels { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(.6rem, 1.5vw, 1.6rem); min-height: min(30vh, 380px); height: 100%; }
.met-foto .tegel { font-size: clamp(1.3rem, 2.4vw, 3rem); }
.tegel { position: relative; display: flex; align-items: center; gap: .8em; padding: clamp(.8rem, 2vw, 2rem); background: var(--kleur); color: #fff; border-radius: var(--radius); font-size: clamp(1.5rem, 3vw, 3.6rem); font-weight: 600; box-shadow: 0 .4rem 0 rgba(0, 0, 0, .15), var(--shadow); transition: opacity .5s, transform .5s, filter .5s; }
.tegel .letter { width: 1.7em; height: 1.7em; border-radius: .45em; background: rgba(255, 255, 255, .28); font-size: 1em; }
.tegel.fout { opacity: .25; filter: grayscale(.7); transform: scale(.96); }
.tegel.juist { animation: feest .9s ease-out forwards; box-shadow: 0 0 0 .35rem #fff, 0 0 0 .75rem var(--kleur), var(--shadow); }
.tegel.juist::after { content: "✔"; position: absolute; top: -.45em; right: -.3em; width: 1.5em; height: 1.5em; border-radius: 50%; background: #fff; color: var(--c); display: grid; place-items: center; box-shadow: var(--shadow); font-size: .8em; }
.kiezers { position: absolute; bottom: .5em; right: .6em; display: flex; gap: .25em; }
.kiezer { width: .55em; height: .55em; border-radius: 50%; background: var(--kleur); border: .12em solid #fff; }
@keyframes feest {
	0% { transform: scale(1); }
	30% { transform: scale(1.07) rotate(-1.5deg); }
	55% { transform: scale(.99) rotate(1deg); }
	100% { transform: scale(1.03); }
}

.teams { display: flex; flex-wrap: wrap; justify-content: center; gap: .8rem 1rem; }
.team { position: relative; display: flex; align-items: center; gap: .6rem; background: #fff; border-radius: 999px; padding: .35rem .45rem .35rem 1.1rem; border: 4px solid var(--kleur); box-shadow: var(--shadow); transition: opacity .4s; }
.team-naam { font-weight: 700; color: var(--kleur); margin-right: .2rem; }
.keuze-knoppen { display: flex; gap: .3rem; }
.keuze { width: 2.6rem; height: 2.6rem; padding: 0; background: #fff; color: var(--tegel); border: 3px solid var(--tegel); font-weight: 700; transition: transform .15s; }
.keuze.gekozen { background: var(--tegel); color: #fff; transform: scale(1.12); }
.keuze:disabled { cursor: default; }
.team.goed { animation: hup .6s ease-out; }
.team.mis { opacity: .55; }
.plus { position: absolute; top: -1em; right: -.4em; background: var(--c); color: #fff; border-radius: 999px; padding: .05em .55em; font-weight: 700; animation: plus .7s ease-out both; }
@keyframes hup { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-14px); } }
@keyframes plus { from { opacity: 0; transform: translateY(10px) scale(.6); } to { opacity: 1; transform: none; } }

.actie { display: flex; justify-content: center; }
.scorebord { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; background: rgba(255, 255, 255, .7); border-radius: 999px; padding: .45rem .7rem; font-size: .95em; }
.score { display: flex; align-items: center; gap: .5em; padding: .15em .25em .15em .9em; border-radius: 999px; background: var(--kleur); color: #fff; font-weight: 600; }
.score b { min-width: 1.7em; text-align: center; background: rgba(255, 255, 255, .3); border-radius: 999px; padding: 0 .4em; }

/* Podium */
.podium-scherm { min-height: 100vh; max-width: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; text-align: center; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: clamp(.5rem, 1.5vw, 1.5rem); width: min(1100px, 100%); }
.trede { flex: 1; display: flex; flex-direction: column; gap: .6rem; animation: omhoog .8s cubic-bezier(.2, 1.4, .4, 1) both; }
.trede-3 { animation-delay: .2s; }
.trede-2 { animation-delay: .8s; }
.trede-1 { animation-delay: 1.4s; }
.trede.leeg { opacity: .35; }
.op-trede { display: flex; flex-direction: column; gap: .5rem; }
.blok { display: flex; flex-direction: column; align-items: center; padding-top: .8rem; border-radius: var(--radius) var(--radius) 0 0; color: #fff; font-size: clamp(2rem, 4vw, 4.5rem); font-weight: 700; text-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.trede-1 .blok { height: clamp(160px, 30vh, 340px); background: linear-gradient(#f7c948, #dd9a00); }
.trede-2 .blok { height: clamp(110px, 21vh, 240px); background: linear-gradient(#cfd8dc, #98a9b1); }
.trede-3 .blok { height: clamp(80px, 14vh, 170px); background: linear-gradient(#e6a274, #b26a38); }
.winnaar { display: flex; flex-direction: column; background: #fff; border-radius: 22px; border: 5px solid var(--kleur); padding: .5rem .8rem; box-shadow: var(--shadow); }
.w-naam { font-size: clamp(1.3rem, 2.6vw, 3rem); font-weight: 700; color: var(--kleur); overflow-wrap: anywhere; }
.trede-1 .w-naam { font-size: clamp(1.6rem, 3.4vw, 4rem); }
.w-score { color: var(--muted); }
.rest { list-style: none; padding: 0; margin: 0; display: flex; gap: .6rem 1.5rem; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 1.2em; }
@keyframes omhoog { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

@media (max-width: 700px) {
	.kop, main { padding-left: 16px; padding-right: 16px; }
	.rij { grid-template-columns: auto 1fr; }
	.duim { display: none; }
	.rij-knoppen { grid-column: 1 / -1; justify-content: flex-end; }
	.tegels, .met-foto .midden { grid-template-columns: 1fr; }
	.antw-rij { grid-template-columns: auto 1fr; }
	.juist-keuze { grid-column: 2; }
}
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
<script>
const SLEUTEL = 'omaquiz.vragen';
const LETTERS = ['A', 'B', 'C', 'D'];
const TEGELKLEUR = ['var(--a)', 'var(--b)', 'var(--c)', 'var(--d)'];
const TEAMKLEUREN = ['#c2185b', '#1e6fd9', '#2e8b3e', '#d9600b', '#6f42c1', '#8d5524'];

const VOORBEELD = [
	{ vraag: 'Wat is de lievelingsbloem van oma?', antwoorden: ['Roos', 'Tulp', 'Hortensia', 'Zonnebloem'], juist: 2 },
	{ vraag: 'In welke stad is oma geboren?', antwoorden: ['Geel', 'Lier', 'Mol', 'Herentals'], juist: 1 },
	{ vraag: 'Wat was de eerste job van oma?', antwoorden: ['Naaister in een atelier', 'Verkoopster bij de bakker', 'Typiste op het gemeentehuis', 'Kleuterjuf'], juist: 1 },
	{ vraag: 'Wat is de specialiteit van oma in de keuken?', antwoorden: ['Stoofvlees met frietjes', 'Rijstpap', 'Konijn met pruimen', 'Vol-au-vent'], juist: 2 },
	{ vraag: 'Waar ging oma op huwelijksreis?', antwoorden: ['Blankenberge', 'Parijs', 'Rome', 'De Ardennen'], juist: 3 },
].map(v => ({ ...v, foto: null }));

let vragen = laad();
let scherm = 'maken';
let bewerken = null;
let spelers = ['Team 1', 'Team 2'];
let spel = null;

function laad() {
	try {
		const ruw = localStorage.getItem(SLEUTEL);
		if (ruw) return JSON.parse(ruw);
	} catch { /* geen opslag beschikbaar: start met de voorbeeldvragen */ }
	return structuredClone(VOORBEELD);
}

function bewaar() {
	try {
		localStorage.setItem(SLEUTEL, JSON.stringify(vragen));
		return true;
	} catch {
		alert('Dit kon niet bewaard worden: de browser heeft geen plaats meer. Probeer een kleinere foto, of haal een foto weg.');
		return false;
	}
}

function h(tag, props, ...kinderen) {
	const el = document.createElement(tag);
	for (const [k, v] of Object.entries(props || {})) {
		if (v == null || v === false) continue;
		if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
		else if (k === 'class') el.className = v;
		else if (k === 'style') el.style.cssText = v;
		else if (k === 'value' || k === 'checked') el[k] = v;
		else el.setAttribute(k, v === true ? '' : v);
	}
	for (const kind of kinderen.flat()) {
		if (kind == null || kind === false) continue;
		el.append(kind instanceof Node ? kind : String(kind));
	}
	return el;
}

function teken() {
	const app = document.getElementById('app');
	if (spel) app.replaceChildren(spel.klaar ? podiumScherm() : vraagScherm());
	else app.replaceChildren(kop(), scherm === 'maken' ? makenScherm() : opstellingScherm());
}

function kop() {
	const tab = (id, label) => h('button', { class: 'tab', 'aria-current': scherm === id ? 'page' : null, onclick: () => { scherm = id; teken(); } }, label);
	return h('header', { class: 'kop' },
		h('h1', {}, '🎂 Wie kent oma het best?'),
		h('nav', { class: 'tabs' }, tab('maken', '✏️ Quiz maken'), tab('spelen', '🎉 Spelen')));
}

/* ---------- Quiz maken ---------- */

function makenScherm() {
	return h('main', { class: 'maken' },
		h('div', { class: 'maken-kop' },
			h('h2', {}, 'Jouw vragen ', h('span', { class: 'tel' }, vragen.length)),
			h('button', { class: 'btn primary', onclick: () => openEditor(null) }, '＋ Nieuwe vraag')),
		vragen.length
			? h('ol', { class: 'lijst' }, vragen.map(vraagRij))
			: h('p', { class: 'leeg-tekst' }, 'Nog geen vragen. Voeg er eentje toe!'),
		bewerken && editor());
}

function vraagRij(v, i) {
	return h('li', { class: 'rij' },
		h('span', { class: 'nr' }, i + 1),
		v.foto ? h('img', { class: 'duim', src: v.foto, alt: '' }) : h('span', { class: 'duim' }, '🌷'),
		h('div', { class: 'rij-tekst' },
			h('strong', {}, v.vraag),
			h('span', { class: 'juist-antw' }, `✔ ${LETTERS[v.juist]}. ${v.antwoorden[v.juist]}`)),
		h('div', { class: 'rij-knoppen' },
			h('button', { class: 'icoon', title: 'Omhoog', 'aria-label': 'Omhoog', disabled: i === 0, onclick: () => verschuif(i, -1) }, '▲'),
			h('button', { class: 'icoon', title: 'Omlaag', 'aria-label': 'Omlaag', disabled: i === vragen.length - 1, onclick: () => verschuif(i, 1) }, '▼'),
			h('button', { class: 'icoon', title: 'Aanpassen', 'aria-label': 'Aanpassen', onclick: () => openEditor(i) }, '✎'),
			h('button', { class: 'icoon', title: 'Verwijderen', 'aria-label': 'Verwijderen', onclick: () => verwijder(i) }, '🗑')));
}

function verschuif(i, richting) {
	const j = i + richting;
	[vragen[i], vragen[j]] = [vragen[j], vragen[i]];
	if (!bewaar()) [vragen[i], vragen[j]] = [vragen[j], vragen[i]];
	teken();
}

function verwijder(i) {
	if (!confirm(`"${vragen[i].vraag}" verwijderen?`)) return;
	const [weg] = vragen.splice(i, 1);
	if (!bewaar()) vragen.splice(i, 0, weg);
	teken();
}

function openEditor(index) {
	const bron = index == null ? { vraag: '', antwoorden: ['', '', '', ''], juist: 0, foto: null } : vragen[index];
	bewerken = { index, concept: structuredClone(bron) };
	teken();
	document.querySelector('.editor textarea').focus();
}

function sluitEditor() {
	bewerken = null;
	teken();
}

function bewaarConcept() {
	const c = bewerken.concept;
	const vraag = { vraag: c.vraag.trim(), antwoorden: c.antwoorden.map(a => a.trim()), juist: c.juist, foto: c.foto };
	const vorige = vragen.slice();
	if (bewerken.index == null) vragen.push(vraag);
	else vragen[bewerken.index] = vraag;
	if (!bewaar()) { vragen = vorige; return; }
	sluitEditor();
}

function editor() {
	const c = bewerken.concept;
	const nieuw = bewerken.index == null;
	return h('div', { class: 'overlay', onclick: e => { if (e.target === e.currentTarget) sluitEditor(); } },
		h('form', { class: 'editor', onsubmit: e => { e.preventDefault(); bewaarConcept(); } },
			h('h2', {}, nieuw ? 'Nieuwe vraag' : `Vraag ${bewerken.index + 1} aanpassen`),
			h('label', { class: 'veld' }, 'Vraag',
				h('textarea', { rows: 2, required: true, value: c.vraag, placeholder: 'Bv. Wat is de lievelingskleur van oma?', oninput: e => { c.vraag = e.target.value; } })),
			h('fieldset', {},
				h('legend', {}, 'Antwoorden — duid het juiste aan'),
				c.antwoorden.map((a, i) => h('div', { class: `antw-rij${c.juist === i ? ' juist' : ''}` },
					h('span', { class: 'letter', style: `--kleur:${TEGELKLEUR[i]}` }, LETTERS[i]),
					h('input', { type: 'text', required: true, value: a, 'aria-label': `Antwoord ${LETTERS[i]}`, oninput: e => { c.antwoorden[i] = e.target.value; } }),
					h('label', { class: 'juist-keuze' },
						h('input', { type: 'radio', name: 'juist', checked: c.juist === i, onchange: e => kiesJuist(e, i) }),
						'Juist')))),
			h('div', { class: 'veld' }, 'Foto (mag ook zonder)',
				h('div', { class: 'foto-veld' },
					c.foto && h('img', { src: c.foto, alt: 'Gekozen foto' }),
					h('label', { class: 'btn' }, c.foto ? '📷 Andere foto' : '📷 Foto kiezen',
						h('input', { type: 'file', accept: 'image/*', onchange: e => kiesFoto(e.target.files[0]) })),
					c.foto && h('button', { type: 'button', class: 'btn', onclick: () => { c.foto = null; teken(); } }, 'Foto weghalen'))),
			h('div', { class: 'knoppen' },
				h('button', { type: 'button', class: 'btn', onclick: sluitEditor }, 'Annuleren'),
				h('button', { type: 'submit', class: 'btn primary' }, nieuw ? 'Toevoegen' : 'Opslaan'))));
}

function kiesJuist(e, i) {
	bewerken.concept.juist = i;
	e.target.closest('fieldset').querySelectorAll('.antw-rij').forEach((rij, j) => rij.classList.toggle('juist', j === i));
}

async function kiesFoto(bestand) {
	if (!bestand) return;
	try {
		bewerken.concept.foto = await verklein(bestand);
	} catch {
		alert('Dat bestand kon niet als foto gelezen worden.');
	}
	teken();
}

// localStorage holds ~5 MB in total, so photos are shrunk to a few hundred KB each.
function verklein(bestand, max = 1024) {
	return new Promise((ok, mis) => {
		const url = URL.createObjectURL(bestand);
		const img = new Image();
		img.onload = () => {
			const schaal = Math.min(1, max / Math.max(img.width, img.height));
			const doek = document.createElement('canvas');
			doek.width = Math.round(img.width * schaal);
			doek.height = Math.round(img.height * schaal);
			doek.getContext('2d').drawImage(img, 0, 0, doek.width, doek.height);
			URL.revokeObjectURL(url);
			ok(doek.toDataURL('image/jpeg', 0.8));
		};
		img.onerror = () => { URL.revokeObjectURL(url); mis(new Error('geen afbeelding')); };
		img.src = url;
	});
}

/* ---------- Spelen ---------- */

function opstellingScherm() {
	const kan = vragen.length > 0;
	return h('main', { class: 'opstelling' },
		h('h2', { class: 'titel-groot' }, 'Wie speelt er mee?'),
		h('p', { class: 'sub' }, '2 tot 6 spelers of teams'),
		h('ul', { class: 'spelers' }, spelers.map((naam, i) => h('li', { style: `--kleur:${TEAMKLEUREN[i]}` },
			h('span', { class: 'bol' }),
			h('input', { type: 'text', value: naam, maxlength: 20, 'aria-label': `Naam speler ${i + 1}`, oninput: e => { spelers[i] = e.target.value; } }),
			spelers.length > 2 && h('button', { class: 'icoon', title: 'Verwijderen', 'aria-label': `Speler ${i + 1} verwijderen`, onclick: () => { spelers.splice(i, 1); teken(); } }, '✕')))),
		spelers.length < 6 && h('button', { class: 'btn', onclick: () => { spelers.push(`Team ${spelers.length + 1}`); teken(); } }, '＋ Speler toevoegen'),
		h('button', { class: 'btn primary groot', disabled: !kan, onclick: startSpel }, 'Start de quiz 🎉'),
		!kan && h('p', { class: 'sub' }, 'Maak eerst een paar vragen in "Quiz maken".'));
}

function startSpel() {
	spel = {
		vragen: structuredClone(vragen),
		teams: spelers.map((naam, i) => ({ naam: naam.trim() || `Team ${i + 1}`, kleur: TEAMKLEUREN[i], score: 0 })),
		nr: 0,
		keuzes: spelers.map(() => null),
		onthuld: false,
		klaar: false,
	};
	teken();
}

function stopSpel() {
	if (!confirm('De quiz stoppen? De scores gaan verloren.')) return;
	spel = null;
	confetti.stop();
	teken();
}

function vraagScherm() {
	const v = spel.vragen[spel.nr];
	const laatste = spel.nr === spel.vragen.length - 1;
	return h('main', { class: `spel${v.foto ? ' met-foto' : ''}` },
		h('div', { class: 'spel-top' },
			h('span', { class: 'voortgang' }, `Vraag ${spel.nr + 1} van ${spel.vragen.length}`),
			h('button', { class: 'stop', onclick: stopSpel }, '✕ Stoppen')),
		h('h1', { class: 'vraag' }, v.vraag),
		h('div', { class: 'midden' },
			v.foto && h('img', { class: 'foto', src: v.foto, alt: '' }),
			h('div', { class: 'tegels' }, v.antwoorden.map((a, i) => h('div', {
			class: `tegel${spel.onthuld ? (i === v.juist ? ' juist' : ' fout') : ''}`,
			style: `--kleur:${TEGELKLEUR[i]}`,
		},
			h('span', { class: 'letter' }, LETTERS[i]),
			h('span', {}, a),
			h('span', { class: 'kiezers' }, spel.teams
				.filter((_, t) => spel.keuzes[t] === i)
				.map(t => h('span', { class: 'kiezer', title: t.naam, style: `--kleur:${t.kleur}` }))))))),
		h('div', { class: 'teams' }, spel.teams.map((t, i) => teamKeuze(t, i, v))),
		h('div', { class: 'actie' }, spel.onthuld
			? h('button', { class: 'btn primary groot', onclick: volgende }, laatste ? 'Naar de uitslag 🏆' : 'Volgende vraag ➜')
			: h('button', { class: 'btn primary groot', onclick: toonAntwoord }, 'Toon antwoord')),
		spel.onthuld && scorebord());
}

function teamKeuze(team, t, v) {
	const keuze = spel.keuzes[t];
	const goed = keuze === v.juist;
	return h('div', { class: `team${spel.onthuld ? (goed ? ' goed' : ' mis') : ''}`, style: `--kleur:${team.kleur}` },
		h('span', { class: 'team-naam' }, team.naam),
		h('div', { class: 'keuze-knoppen' }, LETTERS.map((letter, i) => h('button', {
			class: `keuze${keuze === i ? ' gekozen' : ''}`,
			style: `--tegel:${TEGELKLEUR[i]}`,
			disabled: spel.onthuld,
			'aria-pressed': String(keuze === i),
			'aria-label': `${team.naam} kiest ${letter}`,
			onclick: () => { spel.keuzes[t] = keuze === i ? null : i; teken(); },
		}, letter))),
		spel.onthuld && goed && h('span', { class: 'plus' }, '+1'));
}

function toonAntwoord() {
	const juist = spel.vragen[spel.nr].juist;
	spel.teams.forEach((team, t) => { if (spel.keuzes[t] === juist) team.score++; });
	spel.onthuld = true;
	teken();
	const r = document.querySelector('.tegel.juist').getBoundingClientRect();
	confetti.knal(r.left + r.width / 2, r.top + r.height / 2);
}

function scorebord() {
	return h('div', { class: 'scorebord', 'aria-label': 'Tussenstand' }, rangschik(spel.teams).map(t =>
		h('span', { class: 'score', style: `--kleur:${t.kleur}` }, t.naam, h('b', {}, t.score))));
}

function volgende() {
	if (spel.nr === spel.vragen.length - 1) {
		spel.klaar = true;
		teken();
		setTimeout(() => { if (spel?.klaar) confetti.regen(6000); }, 1500);
		return;
	}
	spel.nr++;
	spel.keuzes = spel.teams.map(() => null);
	spel.onthuld = false;
	teken();
}

// Gelijke scores delen dezelfde plaats (1, 1, 3, …).
function rangschik(teams) {
	return teams
		.map(t => ({ ...t, plaats: 1 + teams.filter(o => o.score > t.score).length }))
		.sort((a, b) => a.plaats - b.plaats);
}

function podiumScherm() {
	const stand = rangschik(spel.teams);
	const winnaars = stand.filter(t => t.plaats === 1);
	const trede = (plaats, medaille) => {
		const hier = stand.filter(t => t.plaats === plaats);
		return h('div', { class: `trede trede-${plaats}${hier.length ? '' : ' leeg'}` },
			h('div', { class: 'op-trede' }, hier.map(t => h('div', { class: 'winnaar', style: `--kleur:${t.kleur}` },
				h('span', { class: 'w-naam' }, t.naam),
				h('span', { class: 'w-score' }, `${t.score} ${t.score === 1 ? 'punt' : 'punten'}`)))),
			h('div', { class: 'blok' }, h('span', {}, medaille), plaats));
	};
	const rest = stand.filter(t => t.plaats > 3);
	return h('main', { class: 'podium-scherm' },
		h('h1', { class: 'titel-groot' }, winnaars.length > 1 ? '🏆 Gelijkspel aan de top!' : `🏆 ${winnaars[0].naam} kent oma het best!`),
		h('div', { class: 'podium' }, trede(2, '🥈'), trede(1, '🥇'), trede(3, '🥉')),
		rest.length > 0 && h('ol', { class: 'rest' }, rest.map(t => h('li', {}, `${t.plaats}e ${t.naam} · ${t.score}`))),
		h('button', { class: 'btn primary groot', onclick: opnieuw }, '🔁 Opnieuw spelen'));
}

function opnieuw() {
	spelers = spel.teams.map(t => t.naam);
	spel = null;
	scherm = 'spelen';
	confetti.stop();
	teken();
}

/* ---------- Confetti ---------- */

const confetti = (() => {
	const doek = document.getElementById('confetti');
	const ctx = doek.getContext('2d');
	const kleuren = ['#e8553d', '#e8960c', '#2a9d8f', '#8e4fa8', '#ffd23f', '#ff7aa2'];
	let deeltjes = [];
	let loopt = false;
	let regenTot = 0;
	const dpr = () => window.devicePixelRatio || 1;

	function maat() {
		doek.width = innerWidth * dpr();
		doek.height = innerHeight * dpr();
	}
	addEventListener('resize', maat);
	maat();

	function deeltje(x, y, vx, vy) {
		return { x, y, vx, vy, b: (8 + Math.random() * 8) * dpr(), rot: Math.random() * 6, vr: (Math.random() - .5) * .3, kleur: kleuren[Math.random() * kleuren.length | 0] };
	}

	function stap() {
		if (performance.now() < regenTot) {
			for (let i = 0; i < 4; i++) deeltjes.push(deeltje(Math.random() * doek.width, -20, (Math.random() - .5) * 2, Math.random() * 2 * dpr()));
		}
		ctx.clearRect(0, 0, doek.width, doek.height);
		const g = .25 * dpr();
		deeltjes = deeltjes.filter(d => d.y < doek.height + 40);
		for (const d of deeltjes) {
			d.vx *= .98;
			d.vy = d.vy * .98 + g;
			d.x += d.vx;
			d.y += d.vy;
			d.rot += d.vr;
			ctx.save();
			ctx.translate(d.x, d.y);
			ctx.rotate(d.rot);
			ctx.fillStyle = d.kleur;
			ctx.fillRect(-d.b / 2, -d.b / 4, d.b, d.b / 2);
			ctx.restore();
		}
		if (deeltjes.length || performance.now() < regenTot) requestAnimationFrame(stap);
		else loopt = false;
	}

	function start() {
		if (loopt) return;
		loopt = true;
		requestAnimationFrame(stap);
	}

	return {
		knal(x, y, aantal = 90) {
			const s = dpr();
			for (let i = 0; i < aantal; i++) {
				const hoek = Math.random() * Math.PI * 2;
				const kracht = (6 + Math.random() * 10) * s;
				deeltjes.push(deeltje(x * s, y * s, Math.cos(hoek) * kracht, Math.sin(hoek) * kracht - 6 * s));
			}
			start();
		},
		regen(ms) {
			regenTot = performance.now() + ms;
			start();
		},
		stop() {
			regenTot = 0;
			deeltjes = [];
		},
	};
})();

teken();
</script>
